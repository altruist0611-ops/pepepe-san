{{ define "main" }}
<article class="post product-page">
  <header class="post-head">
    <p class="post-kicker">雛形テンプレート販売</p>
    <h1>{{ .Title }}</h1>
  </header>

  <div class="product-buybox">
    <p class="product-price">{{ .Params.price }}</p>
    <a class="buy-button" href="{{ .Params.buyUrl }}" target="_blank" rel="noopener">{{ .Params.buyLabel }}</a>
    <p class="product-note">お支払い完了後、その場でダウンロードページをご案内します（クレジットカード決済／Stripe）。</p>
  </div>

  <div class="post-body">
    {{ .Content }}
  </div>

  <div class="product-buybox product-buybox-bottom">
    <p class="product-price">{{ .Params.price }}</p>
    <a class="buy-button" href="{{ .Params.buyUrl }}" target="_blank" rel="noopener">{{ .Params.buyLabel }}</a>
    <p class="product-note">ご購入前に <a href="{{ "/tokushoho/" | relURL }}">特定商取引法に基づく表記</a> もご確認ください。</p>
  </div>

  <p class="backlink"><a href="{{ "/" | relURL }}">← 記事一覧へ戻る</a></p>
</article>
{{ end }}
