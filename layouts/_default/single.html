{{ define "main" }}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ .Title | jsonify }},
    "description": {{ .Description | jsonify }},
    "datePublished": "{{ .Date.Format "2006-01-02" }}",
    "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
    "author": { "@type": "Person", "name": {{ .Site.Params.author | jsonify }} },
    "publisher": { "@type": "Organization", "name": {{ .Site.Title | jsonify }} },
    "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ .Permalink }}" },
    "image": "{{ "images/og-image.png" | absURL }}"
  }
</script>
<article class="post">
  <header class="post-head">
    <p class="post-kicker">{{ .Section }}</p>
    <h1>{{ .Title }}</h1>
    <p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年1月2日" }}</time></p>
  </header>

  <!-- 広告枠（記事上部）：ASP・AdSenseのタグをここに貼る -->

  <div class="post-body">
    {{ .Content }}
  </div>

  <!-- 広告枠（記事下部）：ASP・AdSenseのタグをここに貼る -->

  <p class="backlink"><a href="{{ "/" | relURL }}">← 記事一覧へ戻る</a></p>
</article>
{{ end }}
