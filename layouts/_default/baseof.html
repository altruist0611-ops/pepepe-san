<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}｜{{ .Site.Params.description | truncate 40 " " }}{{ else }}{{ .Title }}｜{{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | relURL }}" title="{{ .Site.Title }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
<header class="sitehead">
  <div class="wrap sitehead-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark">帖</span>
      <span class="brand-name">{{ .Site.Title }}</span>
    </a>
    <p class="brand-tagline">訪問系障害福祉サービスの開業・運営を、行政書士の実務目線で</p>
  </div>
</header>
<main class="wrap">
{{ block "main" . }}{{ end }}
</main>
<footer class="sitefoot">
  <div class="wrap">
    <p>執筆：{{ .Site.Params.author }}</p>
    <p class="fine">本ブログの内容は一般的な情報提供を目的としたものであり、個別の事業所についての法的な助言ではありません。実際の手続き・判断については最新の公表情報をご確認のうえ、専門家にご相談ください。</p>
  </div>
</footer>
</body>
</html>
