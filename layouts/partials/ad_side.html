{{- $slot := index site.Data.ads "side" -}}
{{- if and $slot $slot.html -}}
<style>
article.post{position:relative}
.ad-side{display:none}
@media (min-width:1440px){
.ad-side{display:block;position:absolute;top:0;left:100%;margin-left:32px;width:326px;height:100%}
.ad-side-in{position:sticky;top:24px;box-sizing:border-box;padding:12px;border:1px solid #e2e0d8;border-radius:8px;background:#fbfaf6;text-align:center}
.ad-side-in p{margin:0 0 8px;font-size:12px;color:#777;letter-spacing:.05em}
.ad-side-in img{max-width:100%;height:auto}
}
</style>
<aside class="ad-side" aria-label="広告"><div class="ad-side-in"><p>PR（広告）</p><div>{{ $slot.html | safeHTML }}</div></div></aside>
{{- end -}}
