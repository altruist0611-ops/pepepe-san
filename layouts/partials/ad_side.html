{{- $slot := index site.Data.ads "side" -}}
{{- if and $slot $slot.html -}}
<style>
article.post{position:relative}
.ad-side{display:none}
@media (min-width:1440px){
.ad-side{display:block;position:absolute;top:0;left:100%;margin-left:32px;width:326px;height:100%}
.ad-side .ad-side-in{position:sticky;top:24px}
}
</style>
<aside class="ad-side" aria-label="広告"><div class="ad-side-in ad-slot"><p class="ad-slot-label">PR（広告）</p><div class="ad-slot-body">{{ $slot.html | safeHTML }}</div></div></aside>
{{- end -}}
