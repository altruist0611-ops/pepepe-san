{{- $current := . -}}
<div class="cattiles">
  {{ range site.Data.postcats }}
  {{ $ps := partial "catposts.html" . }}
  {{ if and $ps (ne .key $current) }}
  <a class="cattile cattile-{{ .color }}" href="{{ printf "/category/%s/" .key | relURL }}">
    <span class="cattile-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{ .icon }}"/></svg></span>
    <span class="cattile-body">
      <span class="cattile-title">{{ .title }}</span>
      <span class="cattile-count">{{ len $ps }}記事</span>
    </span>
    <span class="cattile-arrow">›</span>
  </a>
  {{ end }}
  {{ end }}
</div>
